name = "sms-api-middleware"
main = "src/index.js"
compatibility_date = "2026-08-04"

# Enable Node.js compatibility (default in newer dates)
# For older dates, uncomment:
# compatibility_flags = ["nodejs_compat"]

# Environment variables
[vars]
ENCRYPTION_KEY = "your-secret-encryption-key-32-chars-long"
ENCRYPTION_IV = "your-16-char-iv"
SMS_API_URL = "https://your-sms-api.com/api/v1/sms/send"
SMS_API_KEY = "your-default-api-key"
RATE_LIMIT_WINDOW_MS = "900000"
RATE_LIMIT_MAX_REQUESTS = "100"
NODE_ENV = "production"

# Secrets (set via CLI)
# These should be set using: wrangler secret put ENCRYPTION_KEY
# wrangler secret put SMS_API_KEY

# Observability
[observability]
enabled = true
head_sampling_rate = 1.0

# Durable Objects (optional - for rate limiting)
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_classes = ["RateLimiterDO"]

# KV Namespace (optional - for persistent rate limiting)
[[kv_namespaces]]
binding = "RATE_LIMIT_STORE"
id = "your-kv-namespace-id"
preview_id = "your-preview-namespace-id"

# Environment-specific configurations
[env.production]
vars = { NODE_ENV = "production" }

[env.staging]
vars = { NODE_ENV = "staging" }